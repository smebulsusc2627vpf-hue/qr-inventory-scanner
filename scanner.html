<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Material Scanner</title>

  <!-- QR scanner library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f9;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .header {
      background: #1f4e78;
      color: white;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 2px 9px rgba(0, 0, 0, 0.08);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 9px;
      background: #eef2f5;
      line-height: 1.5;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 9px;
      background: #6c757d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .manual {
      display: block;
      margin-top: 12px;
      text-align: center;
      color: #1f4e78;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>QR Material Scanner</h1>
      <p>Scan a raw material QR code</p>
    </div>

    <div class="card">

      <div id="reader"></div>

      <button onclick="startScanner()">
        START CAMERA
      </button>

      <button onclick="stopScanner()">
        STOP CAMERA
      </button>

      <div id="status" class="status">
        Press START CAMERA and allow camera access.
      </div>

      <a id="manualLink" class="manual" href="#">
        Return to Inventory System
      </a>

    </div>

  </div>

  <script>
    let scanner = null;
    let scannerRunning = false;

    // Read returnUrl from the URL.
    // Example:
    // scanner.html?returnUrl=https%3A%2F%2Fscript.google.com%2F...
    const params = new URLSearchParams(window.location.search);
    const returnUrl = params.get("returnUrl");

    // Set the return link.
    const manualLink = document.getElementById("manualLink");

    if (returnUrl) {
      manualLink.href = returnUrl;
    } else {
      manualLink.href = "#";
    }

    function showStatus(message, type = "") {
      const status = document.getElementById("status");
      status.className = "status " + type;
      status.textContent = message;
    }

    async function startScanner() {

      if (scannerRunning) {
        return;
      }

      showStatus("Requesting camera permission...");

      try {

        scanner = new Html5Qrcode("reader");

        await scanner.start(
          {
            facingMode: {
              exact: "environment"
            }
          },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },

          function(decodedText) {

            showStatus(
              "QR detected: " + decodedText,
              "success"
            );

            scannerRunning = false;

            scanner.stop()
              .then(function() {

                scanner.clear();

                // Send QR result back to Google Apps Script.
                if (returnUrl) {

                  try {

                    const target =
                      new URL(returnUrl);

                    target.searchParams.set(
                      "materialId",
                      decodedText
                    );

                    window.location.href =
                      target.toString();

                  } catch (error) {

                    showStatus(
                      "Invalid return URL.",
                      "error"
                    );

                  }

                } else {

                  showStatus(
                    "Scanned: " + decodedText +
                    ". No return URL was supplied.",
                    "success"
                  );

                }

              })
              .catch(function(error) {

                scannerRunning = false;

                showStatus(
                  "QR scanned, but the camera could not close.",
                  "error"
                );

              });

          },

          function(errorMessage) {
            // Ignore normal continuous scan errors.
          }
        );

        scannerRunning = true;

        showStatus(
          "Camera is active. Point it at the QR code."
        );

      } catch (error) {

        scannerRunning = false;

        console.error(error);

        showStatus(
          "Camera could not start.\n\n" +
          "Make sure:\n" +
          "1. Camera permission is allowed.\n" +
          "2. This page is opened using HTTPS.\n" +
          "3. You are using a supported browser.\n" +
          "4. Another app is not using the camera.",
          "error"
        );
      }
    }

    async function stopScanner() {

      if (!scanner || !scannerRunning) {
        return;
      }

      try {

        await scanner.stop();

        scanner.clear();

      } catch (error) {

        console.error(error);

      }

      scannerRunning = false;

      showStatus(
        "Camera stopped."
      );
    }
  </script>

</body>
</html>
