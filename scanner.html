<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>QR Material Scanner</title>

  <!-- QR scanner library -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .header {
      background: #1f4e78;
      color: white;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 8px 0 0;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    #reader {
      width: 100%;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 9px;
      background: #1f4e78;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .stop {
      background: #6c757d;
    }

    .status {
      margin-top: 14px;
      padding: 14px;
      border-radius: 9px;
      background: #eef2f5;
      white-space: pre-line;
      line-height: 1.5;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>
      QR Material Scanner
    </h1>

    <p>
      Raw Material Inventory
    </p>

  </div>


  <div class="card">

    <!-- Camera display -->
    <div id="reader"></div>


    <!-- Start camera -->
    <button
      onclick="startScanner()"
    >
      START CAMERA
    </button>


    <!-- Stop camera -->
    <button
      class="stop"
      onclick="stopScanner()"
    >
      STOP CAMERA
    </button>


    <div
      id="status"
      class="status"
    >
      Press START CAMERA and allow
      camera permission.
    </div>

  </div>

</div>


<script>

  /*
   * ===================================================
   * GET RETURN URL
   * ===================================================
   */

  const parameters =
    new URLSearchParams(
      window.location.search
    );


  const returnUrl =
    parameters.get(
      "returnUrl"
    );


  let scanner =
    null;


  let scanning =
    false;


  let scanCompleted =
    false;


  /*
   * ===================================================
   * DISPLAY STATUS
   * ===================================================
   */

  function showStatus(
    message,
    type = ""
  ) {

    const status =
      document.getElementById(
        "status"
      );


    status.className =
      "status " + type;


    status.textContent =
      message;

  }


  /*
   * ===================================================
   * START CAMERA
   * ===================================================
   */

  async function startScanner() {

    if (scanning) {
      return;
    }


    /*
     * Scanner must be opened
     * from Google Apps Script.
     */

    if (!returnUrl) {

      showStatus(

        "No return URL was provided.\n\n" +
        "Open this scanner from the QR Inventory System.",

        "error"

      );

      return;
    }


    showStatus(
      "Requesting camera permission..."
    );


    try {

      scanner =
        new Html5Qrcode(
          "reader"
        );


      await scanner.start(

        {
          facingMode:
            "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }
        },


        /*
         * QR CODE SUCCESS
         */

        function(
          decodedText
        ) {


          /*
           * Prevent multiple redirects
           */

          if (
            scanCompleted
          ) {

            return;
          }


          scanCompleted =
            true;


          scanning =
            false;


          showStatus(

            "QR Code detected: " +
            decodedText +
            "\n\n" +
            "Returning to inventory system...",

            "success"

          );


          /*
           * Create return URL
           */

          let target;


          try {

            target =
              new URL(
                returnUrl
              );

          }

          catch (
            error
          ) {

            showStatus(

              "Invalid return URL.\n\n" +
              error.message,

              "error"

            );

            scanCompleted =
              false;

            return;

          }


          /*
           * Attach scanned QR value
           */

          target.searchParams.set(

            "materialId",

            decodedText

          );


          /*
           * IMPORTANT:
           * Redirect immediately.
           */

          window.location.replace(

            target.toString()

          );


          /*
           * Stop camera in background.
           */

          if (
            scanner
          ) {

            scanner
              .stop()
              .catch(
                function() {}
              );

          }

        },


        /*
         * Normal scanning errors
         * are ignored.
         */

        function(
          errorMessage
        ) {

        }

      );


      scanning =
        true;


      showStatus(

        "Camera is active.\n\n" +
        "Point the camera at the material QR code."

      );

    }

    catch (
      error
    ) {

      scanning =
        false;


      console.error(
        error
      );


      showStatus(

        "Camera could not start.\n\n" +
        "Allow camera permission and make sure " +
        "this page is opened using HTTPS.",

        "error"

      );

    }

  }


  /*
   * ===================================================
   * STOP CAMERA
   * ===================================================
   */

  async function stopScanner() {

    if (
      !scanner ||
      !scanning
    ) {

      showStatus(
        "Camera is not running."
      );

      return;

    }


    scanning =
      false;


    scanCompleted =
      false;


    try {

      await scanner.stop();

      scanner.clear();

    }

    catch (
      error
    ) {

      console.error(
        error
      );

    }


    showStatus(
      "Camera stopped."
    );

  }

</script>

</body>
</html>
