<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR Material Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .header {
      background: #1f4e78;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    #reader {
      width: 100%;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #1f4e78;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .stop {
      background: #6c757d;
    }

    .status {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      background: #eef2f5;
      white-space: pre-line;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>
      QR Material Scanner
    </h1>

    <p>
      Raw Material Inventory
    </p>

  </div>

  <div class="card">

    <div id="reader"></div>

    <button
      onclick="startScanner()"
    >
      START CAMERA
    </button>

    <button
      class="stop"
      onclick="stopScanner()"
    >
      STOP CAMERA
    </button>

    <div
      id="status"
      class="status"
    >
      Press START CAMERA.
    </div>

  </div>

</div>

<script>

  /*
   * Get the REAL Apps Script Web App URL
   * passed by Index.html.
   */
  const returnUrl =
    new URLSearchParams(
      window.location.search
    ).get("returnUrl");


  let scanner = null;

  let scanning = false;

  let scanned = false;


  function showStatus(
    message,
    type = ""
  ) {

    const status =
      document.getElementById(
        "status"
      );

    status.className =
      "status " + type;

    status.textContent =
      message;
  }


  async function startScanner() {

    if (scanning) {
      return;
    }


    if (!returnUrl) {

      showStatus(

        "No return URL was received.\n\n" +
        "Open this scanner from the inventory system.",

        "error"
      );

      return;
    }


    try {

      scanner =
        new Html5Qrcode(
          "reader"
        );


      await scanner.start(

        {
          facingMode:
            "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }
        },


        function(decodedText) {

          if (scanned) {
            return;
          }


          scanned = true;

          scanning = false;


          let destination;


          try {

            destination =
              new URL(
                returnUrl
              );

          } catch (error) {

            showStatus(
              "Invalid return URL.",
              "error"
            );

            return;
          }


          /*
           * Put the QR value into:
           *
           * ?materialId=RM001
           */
          destination.searchParams.set(
            "materialId",
            decodedText
          );


          showStatus(

            "QR detected: " +
            decodedText +
            "\n\n" +
            "Returning to inventory...",

            "success"
          );


          /*
           * IMPORTANT:
           *
           * Redirect immediately.
           * Do NOT wait for camera.stop().
           */
          window.location.href =
            destination.toString();


          /*
           * Stop camera after navigation starts.
           */
          if (scanner) {

            scanner
              .stop()
              .catch(
                function() {}
              );
          }

        },


        function() {
          /*
           * Normal scanning errors
           * are ignored.
           */
        }
      );


      scanning = true;


      showStatus(
        "Camera is active.\n\n" +
        "Point the camera at the QR code."
      );


    } catch (error) {

      scanning = false;


      showStatus(

        "Camera could not start.\n\n" +
        "Allow camera permission and use HTTPS.",

        "error"
      );

    }
  }


  async function stopScanner() {

    if (!scanner) {
      return;
    }


    scanning = false;

    scanned = false;


    try {

      await scanner.stop();

      scanner.clear();

    } catch (error) {

      console.log(error);
    }


    showStatus(
      "Camera stopped."
    );
  }

</script>

</body>
</html>
